name: Build Mac App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.1.app || echo "使用默认Xcode"

      - name: "Build (ad-hoc signed, universal x86_64+arm64)"
        run: |
          xcodebuild -project GongyuGuanjiaMac.xcodeproj -scheme GongyuGuanjiaMac \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          echo "=== 产物架构 ==="
          file build/Build/Products/Release/GongyuGuanjiaMac.app/Contents/MacOS/GongyuGuanjiaMac || lipo -info build/Build/Products/Release/GongyuGuanjiaMac.app/Contents/MacOS/GongyuGuanjiaMac
          echo "=== 签名状态 ==="
          codesign -dv build/Build/Products/Release/GongyuGuanjiaMac.app 2>&1 | head -5

      - name: Package .app
        run: |
          APP_PATH="build/Build/Products/Release/GongyuGuanjiaMac.app"
          VERSION=$(defaults read "$APP_PATH/Contents/Info" CFBundleShortVersionString 2>/dev/null || echo "1.0")
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/GongyuGuanjiaMac-$VERSION.zip"
          echo "--- 产物 ---"
          ls -la dist/
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gongyuguanjia-mac-${{ env.VERSION }}
          path: dist/*.zip
          if-no-files-found: error
